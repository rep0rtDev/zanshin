name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: console
        working-directory: console
        run: |
          npm ci
          npm run lint
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ZANSHIN_TEST_DATABASE_URL: postgres://zanshin:zanshin@localhost:5432/zanshin
          ZANSHIN_TEST_REDIS_URL: redis://localhost:6379/0

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zanshin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go:
    name: go sdk / nakama module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            sdk/go/go.sum
            nakama/go.sum
      - name: sdk
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: nakama module
        working-directory: nakama
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...

  ts:
    name: ts sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - working-directory: sdk/ts
        run: |
          npm ci
          npm run lint
          npm test

  nakama-runtimes:
    name: nakama ts / lua modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: typescript module compiles to a single file
        working-directory: nakama/ts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s build/zanshin.js
      - name: lua module parses
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.4
          luac5.4 -p nakama/lua/zanshin.lua

  swift:
    name: swift sdk
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - working-directory: sdk/swift
        run: |
          swift build
          swift test

  kotlin:
    name: kotlin sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - working-directory: sdk/kotlin
        run: gradle build --no-daemon

  dart:
    name: dart sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5.4"
      - working-directory: sdk/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  unity:
    name: unity sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - working-directory: sdk/unity
        run: |
          dotnet build Zanshin.csproj -c Release
          dotnet build Tests~/Smoke/Smoke.csproj -c Release

  godot:
    name: godot sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install godot 4.3 (headless)
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
      - name: parse addon + smoke runner (skips the live flow without a server)
        run: ./godot --headless --path sdk/godot/smoke --script res://smoke.gd

  godot3:
    name: godot 3 sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install godot 3.5.3 (headless)
        run: |
          curl -sL -o godot3.zip https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -q godot3.zip && mv Godot_v3.5.3-stable_linux_headless.64 godot3 && chmod +x godot3
      - name: parse addon + smoke runner
        run: ./godot3 --path sdk/godot3/smoke --script res://smoke.gd

  defold:
    name: defold sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 sdk/defold/test/run.py

  cpp:
    name: c++ sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libcurl4-openssl-dev
      - run: make -C sdk/cpp test
      - run: make -C sdk/cpp curl-check
      - run: make -C sdk/cpp test CXX=clang++

  deploy-kit:
    name: deploy kit (helm / compose / alerts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + template
        run: |
          set -e
          args="--set secrets.values.databaseUrl=postgres://x --set secrets.values.redisUrl=redis://x \
                --set secrets.values.jwtSecret=0123456789abcdef0123456789abcdef --set secrets.values.adminBootstrapKey=k \
                --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true \
                --set ingress.adminAllowCidrs={10.0.0.0/8} --set ingress.grpc.enabled=true --set networkPolicy.enabled=true"
          helm lint deploy/helm/zanshin $args
          helm template z deploy/helm/zanshin $args > /tmp/rendered.yaml
          grep -c '^kind:' /tmp/rendered.yaml
      - name: compose config
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          ./init-secrets.sh >/dev/null
          docker compose --profile observability config -q
      - name: promtool check rules
        run: docker run --rm -v "$PWD/deploy/helm/zanshin/alerts.yml:/alerts.yml:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /alerts.yml
      - name: grafana dashboard is valid json
        run: python3 -c "import json,sys; d=json.load(open('deploy/observability/grafana/dashboards/zanshin-overview.json')); print(len(d['panels']), 'panels')"
      - name: k6 scripts parse
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz
          for f in smoke baseline stream; do ./k6-v0.55.0-linux-amd64/k6 inspect deploy/k6/$f.js >/dev/null; done

  live:
    name: live services (Keycloak SSO, ClickHouse, Mailpit, RustFS, Nakama)
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_USER: zanshin
          CLICKHOUSE_PASSWORD: zanshin
          CLICKHOUSE_DB: zanshin
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user zanshin --password zanshin --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 60
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Keycloak (realm import)
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME_STRICT=false -e KC_HTTP_ENABLED=true -e KC_FEATURES=scripts \
            -v "$PWD/crates/zanshin-server/tests/fixtures/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm
      - name: Nakama image with the Zanshin module
        run: docker build -f nakama/Dockerfile -t zanshin-nakama:ci .
      - name: Nakama database + migrate
        run: |
          PGPASSWORD=zanshin psql -h localhost -U zanshin -d zanshin -c "CREATE DATABASE nakama"
          docker run --rm --network host --entrypoint /bin/sh zanshin-nakama:ci -c \
            "/nakama/nakama migrate up --database.address zanshin:zanshin@localhost:5432/nakama"
      - name: RustFS bucket
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ >/dev/null 2>&1 && break || sleep 2; done || true
          AWS_ACCESS_KEY_ID=rustfsadmin AWS_SECRET_ACCESS_KEY=rustfsadmin AWS_EC2_METADATA_DISABLED=true \
            aws --endpoint-url http://localhost:9000 --region us-east-1 s3 mb s3://zanshin-live
      - name: Wait for ClickHouse and Keycloak
        run: |
          for i in $(seq 1 60); do curl -sf -u zanshin:zanshin "http://localhost:8123/?query=SELECT%201" >/dev/null && break; sleep 2; done
          curl -sf -u zanshin:zanshin "http://localhost:8123/?query=SELECT%201" || { echo "clickhouse not ready"; exit 1; }
          for i in $(seq 1 90); do curl -sf http://localhost:8080/realms/zanshin >/dev/null && exit 0; sleep 2; done; docker logs keycloak | tail -50; exit 1
      - name: Build test binary and server (console assets not needed here)
        run: |
          mkdir -p console/dist && touch console/dist/.gitkeep
          cargo build -p zanshin-server --bin zanshin && cargo test -p zanshin-server --test live_services --no-run
      - name: zanshin --doctor
        env:
          ZANSHIN__DATABASE__URL: postgres://zanshin:zanshin@localhost:5432/zanshin
          ZANSHIN__REDIS__URL: redis://localhost:6379/0
          ZANSHIN__CLICKHOUSE__ENABLED: "true"
          ZANSHIN__CLICKHOUSE__URL: http://localhost:8123
          ZANSHIN__CLICKHOUSE__USER: zanshin
          ZANSHIN__CLICKHOUSE__PASSWORD: zanshin
          ZANSHIN__AUTH__JWT_SECRET: ci-live-jwt-0123456789abcdef0123456789abcdef
          ZANSHIN__ADMIN__BOOTSTRAP_KEY: live-bootstrap-admin-key-49
        run: ./target/debug/zanshin --migrate && ./target/debug/zanshin --doctor && ./target/debug/zanshin --doctor --json > /tmp/doctor.json && python3 -c "import json;d=json.load(open('/tmp/doctor.json'));print(len(d['checks']),'checks, ok =',d['ok'])"
      - name: Nakama (module → Zanshin on 127.0.0.1:7560)
        run: |
          docker run -d --name nakama --network host --entrypoint /nakama/nakama \
            -e ZANSHIN_URL=http://127.0.0.1:7560 -e ZANSHIN_SERVER_KEY=live-bootstrap-admin-key-49 zanshin-nakama:ci \
            --database.address zanshin:zanshin@localhost:5432/nakama --logger.level INFO \
            --socket.server_key defaultkey --console.port 7351
          sleep 5; docker logs nakama | tail -20
      - name: live suite
        env:
          ZANSHIN_TEST_DATABASE_URL: postgres://zanshin:zanshin@localhost:5432/zanshin
          ZANSHIN_TEST_REDIS_URL: redis://localhost:6379/0
          ZANSHIN_TEST_KEYCLOAK: http://localhost:8080
          ZANSHIN_TEST_CLICKHOUSE_URL: http://localhost:8123
          ZANSHIN_TEST_SMTP: localhost:1025
          ZANSHIN_TEST_MAILPIT: http://localhost:8025
          ZANSHIN_TEST_S3_ENDPOINT: http://localhost:9000
          ZANSHIN_TEST_NAKAMA: http://localhost:7350
        run: cargo test -p zanshin-server --test live_services -- --nocapture
      - name: logs on failure
        if: failure()
        run: docker logs keycloak | tail -80; docker logs nakama | tail -80

  backup-drill:
    name: backup → restore drill → doctor
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ZANSHIN__DATABASE__URL: postgres://zanshin:zanshin@localhost:5432/zanshin
      ZANSHIN__REDIS__URL: redis://localhost:6379/0
      ZANSHIN__AUTH__JWT_SECRET: ci-drill-jwt-0123456789abcdef0123456789abcdef
      ZANSHIN__ADMIN__BOOTSTRAP_KEY: drill-bootstrap-admin-key-50
      ZANSHIN__PUSH__PROVIDER: log
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build server
        run: mkdir -p console/dist && touch console/dist/.gitkeep && cargo build -p zanshin-server --bin zanshin
      - name: migrate + seed real data through the API
        run: |
          ./target/debug/zanshin --migrate
          ZANSHIN__SERVER__HTTP_ADDR=127.0.0.1:7570 ./target/debug/zanshin > /tmp/zanshin.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7570/healthz >/dev/null && break; sleep 1; done
          H="Authorization: Bearer drill-bootstrap-admin-key-50"
          curl -sf -H "$H" -H 'content-type: application/json' -X POST http://127.0.0.1:7570/admin/v1/flags -d '{"key":"drill_flag","value_type":"bool","default_value":true}' >/dev/null
          SK=$(curl -sf -H "$H" -H 'content-type: application/json' -X POST http://127.0.0.1:7570/admin/v1/api-keys -d '{"name":"drill","kind":"server"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["secret"])')
          for i in 1 2 3; do
            curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST http://127.0.0.1:7570/server/v1/identities -d "{\"external_id\":\"drill-$i\",\"custom\":{\"level\":$i}}" >/dev/null
            curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST http://127.0.0.1:7570/server/v1/events -d "{\"external_id\":\"drill-$i\",\"events\":[{\"name\":\"drillEvent\",\"value\":\"$i\"}]}" >/dev/null
          done
          pkill -x zanshin || true
      - name: backup image
        run: docker build -t zanshin-backup:ci deploy/compose/backup
      - name: backup + restore drill (scratch database)
        run: |
          mkdir -p /tmp/backups /tmp/secrets && printf zanshin > /tmp/secrets/pg && chmod 644 /tmp/secrets/pg && chmod 777 /tmp/backups
          run() { docker run --rm --network host -e PGHOST=localhost -e PGUSER=zanshin -e PGDATABASE=zanshin -e PGPASSWORD_FILE=/s/pg -e CH_URL= -e KEEP_DRILL=1 -v /tmp/backups:/backups -v /tmp/secrets:/s:ro zanshin-backup:ci "$@"; }
          run backup.sh
          ls -la /tmp/backups/*/
          run restore-drill.sh "/backups/$(ls /tmp/backups | tail -1)"
      - name: doctor against the restored database
        run: ZANSHIN__DATABASE__URL=postgres://zanshin:zanshin@localhost:5432/zanshin_drill ./target/debug/zanshin --doctor
      - name: restored data is complete
        run: |
          PGPASSWORD=zanshin psql -h localhost -U zanshin -d zanshin_drill -Atc "SELECT (SELECT count(*) FROM flags WHERE key='drill_flag'), (SELECT count(*) FROM identities WHERE external_id LIKE 'drill-%'), (SELECT count(*) FROM events WHERE name='drillEvent')" | tee /tmp/counts
          [ "$(cat /tmp/counts)" = "1|3|3" ]

  upgrade-drill:
    name: upgrade drill (v0.1.0 data → current migrations)
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ZANSHIN__DATABASE__URL: postgres://zanshin:zanshin@localhost:5432/zanshin
      ZANSHIN__REDIS__URL: redis://localhost:6379/0
      ZANSHIN__AUTH__JWT_SECRET: ci-upgrade-jwt-0123456789abcdef0123456789abcdef
      ZANSHIN__ADMIN__BOOTSTRAP_KEY: upgrade-bootstrap-admin-key-58
      ZANSHIN__PUSH__PROVIDER: log
      OLD_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build current server
        run: mkdir -p console/dist && touch console/dist/.gitkeep && cargo build -p zanshin-server --bin zanshin
      - name: fetch the previous release
        run: |
          curl -fsSL -o /tmp/old.tgz "https://github.com/rep0rtDev/zanshin/releases/download/v${OLD_VERSION}/zanshin-${OLD_VERSION}-linux-amd64.tar.gz"
          mkdir -p /tmp/old && tar xzf /tmp/old.tgz -C /tmp/old --strip-components=1
          /tmp/old/zanshin --version
      - name: old release — migrate, seed real data through its API
        run: |
          /tmp/old/zanshin --migrate
          ZANSHIN__SERVER__HTTP_ADDR=127.0.0.1:7580 /tmp/old/zanshin > /tmp/old.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7580/healthz >/dev/null && break; sleep 1; done
          H="Authorization: Bearer upgrade-bootstrap-admin-key-58"
          curl -sf -H "$H" -H 'content-type: application/json' -X POST http://127.0.0.1:7580/admin/v1/flags -d '{"key":"drill_flag","value_type":"bool","default_value":true}' >/dev/null
          curl -sf -H "$H" -H 'content-type: application/json' -X POST http://127.0.0.1:7580/admin/v1/audiences -d '{"key":"drill_high","name":"High level","condition":{"prop":"custom.level","op":"gte","value":2}}' >/dev/null
          SK=$(curl -sf -H "$H" -H 'content-type: application/json' -X POST http://127.0.0.1:7580/admin/v1/api-keys -d '{"name":"drill","kind":"server"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["secret"])')
          echo "$SK" > /tmp/server.key
          for i in 1 2 3; do
            curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST http://127.0.0.1:7580/server/v1/identities -d "{\"external_id\":\"drill-$i\",\"custom\":{\"level\":$i}}" >/dev/null
            curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST http://127.0.0.1:7580/server/v1/events -d "{\"external_id\":\"drill-$i\",\"events\":[{\"name\":\"drillEvent\",\"value\":\"$i\"}]}" >/dev/null
          done
          pkill -x zanshin || true
          sleep 1
      - name: current build — migrate forward, serve the old data
        run: |
          ./target/debug/zanshin --migrate
          ZANSHIN__SERVER__HTTP_ADDR=127.0.0.1:7581 ./target/debug/zanshin > /tmp/new.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7581/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7581/readyz | tee /tmp/ready.json; echo
          SK=$(cat /tmp/server.key)
          curl -sf -H "x-api-key: $SK" "http://127.0.0.1:7581/server/v1/flags?external_id=drill-1&names=drill_flag" | tee /tmp/flags.json; echo
          python3 -c 'import json; f=json.load(open("/tmp/flags.json"))["flags"]; assert f and f[0]["key"]=="drill_flag" and f[0]["value"] is True, f'
          curl -sf -H "x-api-key: $SK" "http://127.0.0.1:7581/server/v1/audiences?external_id=drill-3" | tee /tmp/aud.json; echo
          python3 -c 'import json; a=json.load(open("/tmp/aud.json"))["audiences"]; assert "drill_high" in a, a'
          curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST http://127.0.0.1:7581/server/v1/events -d '{"external_id":"drill-1","events":[{"name":"drillEvent","value":"4"}]}' >/dev/null
          H="Authorization: Bearer upgrade-bootstrap-admin-key-58"
          curl -sf -H "$H" http://127.0.0.1:7581/admin/v1/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] in ("ok","warn"), h; print("health:", h["status"], h["issues"])'
          pkill -x zanshin || true
          sleep 1
      - name: doctor after the upgrade
        run: ./target/debug/zanshin --doctor
      - name: nothing lost across the upgrade
        run: |
          PGPASSWORD=zanshin psql -h localhost -U zanshin -d zanshin -Atc "SELECT (SELECT count(*) FROM flags WHERE key='drill_flag'), (SELECT count(*) FROM identities WHERE external_id LIKE 'drill-%'), (SELECT count(*) FROM events WHERE name='drillEvent')" | tee /tmp/counts
          [ "$(cat /tmp/counts)" = "1|3|4" ]
      - if: failure()
        run: echo "--- old"; cat /tmp/old.log; echo "--- new"; cat /tmp/new.log

  multi-replica:
    name: two replicas (propagation, rolling restart)
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ZANSHIN__DATABASE__URL: postgres://zanshin:zanshin@localhost:5432/zanshin
      ZANSHIN__REDIS__URL: redis://localhost:6379/0
      ZANSHIN__AUTH__JWT_SECRET: ci-replica-jwt-0123456789abcdef0123456789abcdef
      ZANSHIN__ADMIN__BOOTSTRAP_KEY: replica-bootstrap-admin-key-58
      ZANSHIN__PUSH__PROVIDER: log
      A: http://127.0.0.1:7591
      B: http://127.0.0.1:7592
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build server
        run: mkdir -p console/dist && touch console/dist/.gitkeep && cargo build -p zanshin-server --bin zanshin
      - name: start two replicas on one database
        run: |
          ./target/debug/zanshin --migrate
          start() { ZANSHIN__SERVER__HTTP_ADDR=127.0.0.1:$2 ZANSHIN__SERVER__GRPC_ADDR=127.0.0.1:$3 ./target/debug/zanshin >> /tmp/$1.log 2>&1 & echo $! > /tmp/$1.pid; for i in $(seq 1 60); do curl -sf http://127.0.0.1:$2/healthz >/dev/null && return 0; sleep 1; done; echo "replica $1 did not come up on :$2"; return 1; }
stop() { local pid; pid=$(cat /tmp/$1.pid); kill "$pid"; for i in $(seq 1 100); do kill -0 "$pid" 2>/dev/null || return 0; sleep 0.2; done; echo "replica $1 (pid $pid) did not exit after SIGTERM"; return 1; }
          echo 'start() { ZANSHIN__SERVER__HTTP_ADDR=127.0.0.1:$2 ZANSHIN__SERVER__GRPC_ADDR=127.0.0.1:$3 ./target/debug/zanshin >> /tmp/$1.log 2>&1 & echo $! > /tmp/$1.pid; for i in $(seq 1 60); do curl -sf http://127.0.0.1:$2/healthz >/dev/null && return 0; sleep 1; done; echo "replica $1 did not come up on :$2"; return 1; }
stop() { local pid; pid=$(cat /tmp/$1.pid); kill "$pid"; for i in $(seq 1 100); do kill -0 "$pid" 2>/dev/null || return 0; sleep 0.2; done; echo "replica $1 (pid $pid) did not exit after SIGTERM"; return 1; }' > /tmp/start.sh
          start a 7591 7593
          start b 7592 7594
          curl -sf $A/readyz >/dev/null && curl -sf $B/readyz >/dev/null
      - name: a change on one replica is served by the other within a second
        run: |
          H="Authorization: Bearer replica-bootstrap-admin-key-58"
          SK=$(curl -sf -H "$H" -H 'content-type: application/json' -X POST $A/admin/v1/api-keys -d '{"name":"replica","kind":"server"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["secret"])')
          echo "$SK" > /tmp/server.key
          curl -sf -H "x-api-key: $SK" -H 'content-type: application/json' -X POST $A/server/v1/identities -d '{"external_id":"rep-1","custom":{"vip":true}}' >/dev/null
          # key minted on A works on B immediately (no per-replica cache of credentials)
          curl -sf -H "x-api-key: $SK" "$B/server/v1/flags?external_id=rep-1" >/dev/null
          curl -sf -H "$H" -H 'content-type: application/json' -X POST $A/admin/v1/flags -d '{"key":"rep_flag","value_type":"string","default_value":"v1"}' >/dev/null
          seen() { curl -sf -H "x-api-key: $SK" "$1/server/v1/flags?external_id=rep-1&names=rep_flag" | python3 -c "import json,sys; f=json.load(sys.stdin)['flags']; sys.exit(0 if f and f[0]['value']=='$2' else 1)"; }
          for i in $(seq 1 20); do seen $B v1 && break; sleep 0.25; done; seen $B v1
          curl -sf -H "$H" -H 'content-type: application/json' -X PUT $B/admin/v1/flags/rep_flag -d '{"default_value":"v2"}' >/dev/null
          for i in $(seq 1 20); do seen $A v2 && break; sleep 0.25; done; seen $A v2
          echo "propagation ok"
      - name: rolling restart keeps serving
        run: |
          source /tmp/start.sh
          SK=$(cat /tmp/server.key)
          probe() { curl -sf -o /dev/null $1/readyz && curl -sf -o /dev/null -H "x-api-key: $SK" "$1/server/v1/flags?external_id=rep-1&names=rep_flag"; }
          stop a
          for i in $(seq 1 10); do probe $B || { echo "B stopped serving while A was down"; exit 1; }; sleep 0.3; done
          start a 7591 7593
          probe $A || { echo "restarted A does not serve"; exit 1; }
          stop b
          for i in $(seq 1 10); do probe $A || { echo "A stopped serving while B was down"; exit 1; }; sleep 0.3; done
          start b 7592 7594
          probe $B || { echo "restarted B does not serve"; exit 1; }
          # the replica that came back sees the config written while it was down
          H="Authorization: Bearer replica-bootstrap-admin-key-58"
          curl -sf -H "$H" -H 'content-type: application/json' -X POST $A/admin/v1/flags -d '{"key":"rep_flag_2","value_type":"bool","default_value":true}' >/dev/null || { echo "flag create on A failed"; exit 1; }
          ok=0; for i in $(seq 1 20); do curl -sf -H "x-api-key: $SK" "$B/server/v1/flags?external_id=rep-1&names=rep_flag_2" | python3 -c "import json,sys; f=json.load(sys.stdin)['flags']; sys.exit(0 if f and f[0]['value'] is True else 1)" && { ok=1; break; }; sleep 0.25; done
          [ "$ok" = 1 ] || { echo "B never saw rep_flag_2 created on A after the restart"; exit 1; }
          for r in $A $B; do curl -sf -H "$H" $r/admin/v1/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] in ("ok","warn"), h; print("health", h["process"].get("node_id") or "", h["status"])'; done
          echo "rolling restart ok"
      - if: failure()
        run: echo "--- a"; cat /tmp/a.log; echo "--- b"; cat /tmp/b.log
