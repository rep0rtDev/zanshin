name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: console
        working-directory: console
        run: |
          npm ci
          npm run lint
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ZANSHIN_TEST_DATABASE_URL: postgres://zanshin:zanshin@localhost:5432/zanshin
          ZANSHIN_TEST_REDIS_URL: redis://localhost:6379/0

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zanshin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go:
    name: go sdk / nakama module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            sdk/go/go.sum
            nakama/go.sum
      - name: sdk
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: nakama module
        working-directory: nakama
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...

  ts:
    name: ts sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - working-directory: sdk/ts
        run: |
          npm ci
          npm run lint
          npm test

  nakama-runtimes:
    name: nakama ts / lua modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: typescript module compiles to a single file
        working-directory: nakama/ts
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s build/zanshin.js
      - name: lua module parses
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.4
          luac5.4 -p nakama/lua/zanshin.lua

  swift:
    name: swift sdk
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - working-directory: sdk/swift
        run: |
          swift build
          swift test

  kotlin:
    name: kotlin sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - working-directory: sdk/kotlin
        run: gradle build --no-daemon

  dart:
    name: dart sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5.4"
      - working-directory: sdk/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  unity:
    name: unity sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - working-directory: sdk/unity
        run: |
          dotnet build Zanshin.csproj -c Release
          dotnet build Tests~/Smoke/Smoke.csproj -c Release

  godot:
    name: godot sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install godot 4.3 (headless)
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
      - name: parse addon + smoke runner (skips the live flow without a server)
        run: ./godot --headless --path sdk/godot/smoke --script res://smoke.gd

  deploy-kit:
    name: deploy kit (helm / compose / alerts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint + template
        run: |
          set -e
          args="--set secrets.values.databaseUrl=postgres://x --set secrets.values.redisUrl=redis://x \
                --set secrets.values.jwtSecret=0123456789abcdef0123456789abcdef --set secrets.values.adminBootstrapKey=k \
                --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true \
                --set ingress.adminAllowCidrs={10.0.0.0/8} --set ingress.grpc.enabled=true --set networkPolicy.enabled=true"
          helm lint deploy/helm/zanshin $args
          helm template z deploy/helm/zanshin $args > /tmp/rendered.yaml
          grep -c '^kind:' /tmp/rendered.yaml
      - name: compose config
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          ./init-secrets.sh >/dev/null
          docker compose --profile observability config -q
      - name: promtool check rules
        run: docker run --rm -v "$PWD/deploy/helm/zanshin/alerts.yml:/alerts.yml:ro" --entrypoint promtool prom/prometheus:v2.55.1 check rules /alerts.yml
      - name: grafana dashboard is valid json
        run: python3 -c "import json,sys; d=json.load(open('deploy/observability/grafana/dashboards/zanshin-overview.json')); print(len(d['panels']), 'panels')"
      - name: k6 scripts parse
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar xz
          for f in smoke baseline stream; do ./k6-v0.55.0-linux-amd64/k6 inspect deploy/k6/$f.js >/dev/null; done

