name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanshin
          POSTGRES_PASSWORD: zanshin
          POSTGRES_DB: zanshin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanshin -d zanshin"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: console
        working-directory: console
        run: |
          npm ci
          npm run lint
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ZANSHIN_TEST_DATABASE_URL: postgres://zanshin:zanshin@localhost:5432/zanshin
          ZANSHIN_TEST_REDIS_URL: redis://localhost:6379/0

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zanshin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go:
    name: go sdk / nakama module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            sdk/go/go.sum
            nakama/go.sum
      - name: sdk
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: nakama module
        working-directory: nakama
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...

  ts:
    name: ts sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - working-directory: sdk/ts
        run: |
          npm ci
          npm run lint
          npm test

  unity:
    name: unity sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - working-directory: sdk/unity
        run: |
          dotnet build Zanshin.csproj -c Release
          dotnet build Tests~/Smoke/Smoke.csproj -c Release
