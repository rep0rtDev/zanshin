[package]
name = "zanshin-server"
description = "Zanshin LiveOps server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "zanshin"

[[bin]]
name = "zanshin"
path = "src/main.rs"

[dependencies]
zanshin-core.workspace = true
zanshin-proto.workspace = true
zanshin-store.workspace = true

tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-reflection.workspace = true
prost.workspace = true
prost-types.workspace = true

serde.workspace = true
serde_json.workspace = true
humantime-serde.workspace = true
humantime.workspace = true
figment.workspace = true
clap.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.28"

sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
argon2.workspace = true
base32.workspace = true
url = "2"
rand.workspace = true
base64.workspace = true
tokio-rustls = "0.26"
webpki-roots = "0.26"
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
flate2.workspace = true
roxmltree = "0.20"
x509-parser = "0.16"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { workspace = true }
rust-embed.workspace = true
mime_guess.workspace = true
jsonschema = { version = "0.26", default-features = false, features = ["resolve-http"] }
maxminddb = "0.27"
parquet = { version = "60", default-features = false, features = ["snap"] }
bytes = "1"

[dev-dependencies]
sqlx.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
