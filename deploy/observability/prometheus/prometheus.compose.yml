global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: zanshin
    metrics_path: /metrics
    static_configs:
      - targets: ["zanshin-1:7550", "zanshin-2:7550"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
