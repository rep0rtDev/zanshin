{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zanshin.fullname" . }}
  labels: {{- include "zanshin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.values.databaseUrl (or secrets.existingSecret) is required" .Values.secrets.values.databaseUrl | quote }}
  {{ .Values.secrets.keys.redisUrl }}: {{ required "secrets.values.redisUrl is required" .Values.secrets.values.redisUrl | quote }}
  {{ .Values.secrets.keys.clickhousePassword }}: {{ .Values.secrets.values.clickhousePassword | quote }}
  {{ .Values.secrets.keys.jwtSecret }}: {{ required "secrets.values.jwtSecret is required (>= 32 random chars)" .Values.secrets.values.jwtSecret | quote }}
  {{ .Values.secrets.keys.adminBootstrapKey }}: {{ required "secrets.values.adminBootstrapKey is required" .Values.secrets.values.adminBootstrapKey | quote }}
{{- end }}
