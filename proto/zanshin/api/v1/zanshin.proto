syntax = "proto3";

package zanshin.api.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rep0rtDev/zanshin/sdk/go/zanshin/api/v1;apiv1";

// Client-facing API. Every call except Authenticate* and Healthcheck requires
// a session token (`authorization: Bearer <token>`). Authenticate calls require a
// client API key (`x-api-key: <key>` or HTTP Basic with the key as username).
service Zanshin {
  // Authenticate an identity by its external id. Creates the identity on first use.
  rpc Authenticate(AuthenticateRequest) returns (Session);
  // Exchange a refresh token for a new session (rotates the refresh token).
  rpc AuthenticateRefresh(AuthenticateRefreshRequest) returns (Session);
  // Revoke the current session (access token + refresh token).
  rpc AuthenticateLogout(AuthenticateLogoutRequest) returns (google.protobuf.Empty);

  // Current identity.
  rpc GetIdentity(google.protobuf.Empty) returns (Identity);
  // Delete the current identity and everything attached to it.
  rpc DeleteIdentity(google.protobuf.Empty) returns (google.protobuf.Empty);

  // All properties of the current identity.
  rpc GetProperties(google.protobuf.Empty) returns (Properties);
  // Merge default/custom properties into the current identity.
  rpc UpdateProperties(UpdatePropertiesRequest) returns (Properties);

  // Evaluate feature flags for the current identity (all flags when `names` is empty).
  rpc GetFlags(GetFlagsRequest) returns (FlagList);
  // Evaluate one flag for the current identity.
  rpc GetFlag(GetFlagRequest) returns (Flag);
  // Push re-evaluated flags whenever their definition (or an override) changes.
  rpc StreamFlags(GetFlagsRequest) returns (stream FlagEvent);

  // Audiences the current identity belongs to.
  rpc GetAudiences(google.protobuf.Empty) returns (AudienceList);
  // Experiments the current identity is enrolled in (assigns on first call when eligible).
  rpc GetExperiments(GetExperimentsRequest) returns (ExperimentList);
  // Record that the current identity actually saw its variant.
  rpc ExposeExperiment(ExposeExperimentRequest) returns (google.protobuf.Empty);

  // Live events targeting the current identity (active ones plus their next occurrence).
  rpc GetLiveEvents(GetLiveEventsRequest) returns (LiveEventList);
  // Inbox: delivers pending campaign messages, returns unconsumed ones.
  rpc GetMessages(GetMessagesRequest) returns (MessageList);
  rpc UpdateMessage(UpdateMessageRequest) returns (Message);
  rpc DeleteMessage(MessageIdRequest) returns (google.protobuf.Empty);

  // Report analytics events for the current identity.
  rpc SendEvents(EventBatch) returns (SendEventsResponse);

  // Link the current (typically anonymous) identity to `id`; returns a session for the result.
  rpc Identify(IdentifyRequest) returns (Session);
  // Every identity / experiment / live-event override applied to the caller right now.
  rpc GetFlagOverrides(google.protobuf.Empty) returns (FlagOverrideList);
  // Explicitly join / leave a live event (`join_mode: explicit`).
  rpc JoinLiveEvent(LiveEventKeyRequest) returns (LiveEvent);
  rpc LeaveLiveEvent(LiveEventKeyRequest) returns (LeaveLiveEventResponse);
  // Remove a message from the inbox entirely (DeleteMessage consumes it and keeps a tombstone).
  rpc RemoveMessage(MessageIdRequest) returns (google.protobuf.Empty);
  // Push tokens for this device.
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (PushToken);
  rpc GetPushTokens(google.protobuf.Empty) returns (PushTokenList);
  rpc UnregisterPushToken(UnregisterPushTokenRequest) returns (google.protobuf.Empty);

  // Server-key only: evaluate for any identity by external id (used by backends / Nakama).
  rpc ServerGetFlags(ServerGetFlagsRequest) returns (FlagList);
  rpc ServerSendEvents(ServerEventBatch) returns (SendEventsResponse);
  rpc ServerGetLiveEvents(ServerGetLiveEventsRequest) returns (LiveEventList);
  rpc ServerSendMessage(ServerSendMessageRequest) returns (MessageIdRequest);
  rpc ServerGetAudiences(ServerIdentityRequest) returns (AudienceList);
  rpc ServerGetExperiments(ServerGetExperimentsRequest) returns (ExperimentList);
  rpc ServerGetFlag(ServerGetFlagRequest) returns (Flag);
  // Override chain for one flag as a free-form document (same shape as the REST explain).
  rpc ServerExplainFlag(ServerGetFlagRequest) returns (google.protobuf.Struct);
  rpc ServerUpsertIdentity(ServerUpsertIdentityRequest) returns (IdentityWithProperties);
  rpc ServerIdentify(ServerIdentifyRequest) returns (IdentityWithProperties);
  rpc ServerUpdateProperties(ServerUpdatePropertiesRequest) returns (Properties);
  rpc ServerJoinLiveEvent(ServerLiveEventRequest) returns (LiveEvent);
  rpc ServerLeaveLiveEvent(ServerLiveEventRequest) returns (LeaveLiveEventResponse);
  rpc ServerGetMessages(ServerGetMessagesRequest) returns (MessageList);
  rpc ServerReadMessage(ServerMessageRequest) returns (Message);
  rpc ServerConsumeMessage(ServerMessageRequest) returns (google.protobuf.Empty);
  rpc ServerRemoveMessage(ServerMessageRequest) returns (google.protobuf.Empty);
  // Push membership of a managed audience.
  rpc ServerUpdateAudienceMembers(ServerAudienceMembersRequest) returns (ServerAudienceMembersResponse);

  rpc Healthcheck(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message GetFlagsRequest {
  repeated string names = 1;
}

message GetFlagRequest {
  string name = 1;
}

message ServerGetFlagsRequest {
  string external_id = 1;
  repeated string names = 2;
}

message Flag {
  string name = 1;
  google.protobuf.Value value = 2;
  // bool | string | number | json
  string value_type = 3;
  // Variant key when the value came from a weighted variant.
  string variant = 4;
  // disabled | default | override | rule | variant | experiment
  string reason = 5;
  // Rule id that produced the value, if any.
  string rule_id = 6;
  int64 version = 7;
  // Experiment key when the value came from an experiment variant.
  string experiment = 8;
}

message FlagList {
  repeated Flag flags = 1;
}

message AudienceList {
  repeated string audiences = 1;
}

message GetExperimentsRequest {
  repeated string names = 1;
}

message ExposeExperimentRequest {
  string name = 1;
}

message ServerIdentityRequest {
  string external_id = 1;
}

message ServerGetExperimentsRequest {
  string external_id = 1;
  repeated string names = 2;
}

message Experiment {
  string name = 1;
  string display_name = 2;
  string variant = 3;
  google.protobuf.Value value = 4;
  int64 version = 5;
}

message ExperimentList {
  repeated Experiment experiments = 1;
}

message Event {
  string name = 1;
  string value = 2;
  google.protobuf.Struct metadata = 3;
  // Unix milliseconds; 0 = server receipt time.
  int64 timestamp_ms = 4;
  // Optional client idempotency key (UUID).
  string id = 5;
}

message EventBatch {
  repeated Event events = 1;
}

message ServerEventBatch {
  string external_id = 1;
  repeated Event events = 2;
}

message SendEventsResponse {
  int32 accepted = 1;
}

message GetLiveEventsRequest {
  repeated string names = 1;
  // Include targeted events that are not active right now (with their next occurrence).
  bool include_upcoming = 2;
}

message Occurrence {
  int64 start_unix = 1;
  int64 end_unix = 2;
}

message LiveEvent {
  string name = 1;
  string display_name = 2;
  string description = 3;
  google.protobuf.Value value = 4;
  bool active = 5;
  Occurrence current = 6;
  Occurrence next = 7;
  int64 version = 8;
}

message LiveEventList {
  repeated LiveEvent live_events = 1;
}

message ServerGetLiveEventsRequest {
  string external_id = 1;
  repeated string names = 2;
  bool include_upcoming = 3;
}

message GetMessagesRequest {
  int32 limit = 1;
}

message Message {
  string id = 1;
  string key = 2;
  string title = 3;
  string body = 4;
  string image_url = 5;
  google.protobuf.Value payload = 6;
  int32 priority = 7;
  int64 delivered_unix = 8;
  int64 read_unix = 9;
  int64 expires_unix = 10;
}

message MessageList {
  repeated Message messages = 1;
}

message UpdateMessageRequest {
  string id = 1;
  bool read = 2;
}

message MessageIdRequest {
  string id = 1;
}

message ServerSendMessageRequest {
  string external_id = 1;
  string title = 2;
  string body = 3;
  string image_url = 4;
  google.protobuf.Value payload = 5;
  int32 priority = 6;
  int64 ttl_secs = 7;
}

message FlagEvent {
  oneof event {
    Flag flag = 1;
    string deleted = 2;
  }
}

message Properties {
  // Properties captured automatically or set by the client at authenticate time
  // (platform, country, app version, ...).
  map<string, google.protobuf.Value> default = 1;
  // Properties derived server-side (session count, days since install, ...).
  map<string, google.protobuf.Value> computed = 2;
  // Free-form properties set by the game.
  map<string, google.protobuf.Value> custom = 3;
}

message AuthenticateRequest {
  // External identity id (device id, player id, Nakama user id, ...).
  string id = 1;
  map<string, google.protobuf.Value> default = 2;
  map<string, google.protobuf.Value> custom = 3;
}

message AuthenticateRefreshRequest {
  string refresh_token = 1;
}

message AuthenticateLogoutRequest {
  string token = 1;
  string refresh_token = 2;
}

message Session {
  string token = 1;
  string refresh_token = 2;
  Identity identity = 3;
  Properties properties = 4;
}

message Identity {
  string id = 1;
  string external_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

message UpdatePropertiesRequest {
  map<string, google.protobuf.Value> default = 1;
  map<string, google.protobuf.Value> custom = 2;
  // Recompute computed properties synchronously before returning.
  bool recompute = 3;
}

message IdentifyRequest {
  string id = 1;
}

message FlagOverride {
  string flag_key = 1;
  google.protobuf.Value value = 2;
  // identity | experiment | live_event
  string source = 3;
  // Experiment or live event key behind the override (empty for identity overrides).
  string source_key = 4;
  string variant = 5;
}

message FlagOverrideList {
  repeated FlagOverride overrides = 1;
}

message LiveEventKeyRequest {
  string key = 1;
}

message LeaveLiveEventResponse {
  bool left = 1;
}

message PushToken {
  string identity_id = 1;
  // fcm | apns
  string platform = 2;
  string token = 3;
  string device_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32 failures = 7;
}

message PushTokenList {
  repeated PushToken tokens = 1;
}

message RegisterPushTokenRequest {
  // fcm | apns
  string platform = 1;
  string token = 2;
  string device_id = 3;
}

message UnregisterPushTokenRequest {
  string token = 1;
}

message ServerGetFlagRequest {
  string external_id = 1;
  string name = 2;
}

message ServerUpsertIdentityRequest {
  string external_id = 1;
  map<string, google.protobuf.Value> default = 2;
  map<string, google.protobuf.Value> custom = 3;
}

message ServerIdentifyRequest {
  string external_id = 1;
  // New external id; merges into it when it already exists.
  string id = 2;
}

message ServerUpdatePropertiesRequest {
  string external_id = 1;
  map<string, google.protobuf.Value> default = 2;
  map<string, google.protobuf.Value> custom = 3;
}

message IdentityWithProperties {
  Identity identity = 1;
  Properties properties = 2;
}

message ServerLiveEventRequest {
  string external_id = 1;
  string key = 2;
}

message ServerGetMessagesRequest {
  string external_id = 1;
  int32 limit = 2;
}

message ServerMessageRequest {
  string external_id = 1;
  string id = 2;
}

message ServerAudienceMembersRequest {
  string audience = 1;
  repeated string add = 2;
  repeated string remove = 3;
}

message ServerAudienceMembersResponse {
  int32 added = 1;
  int32 removed = 2;
}
