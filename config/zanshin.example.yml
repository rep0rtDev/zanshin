# Every key can be overridden with an environment variable:
#   ZANSHIN__SERVER__HTTP_ADDR=0.0.0.0:7550  ZANSHIN__AUTH__JWT_SECRET=...
server:
  http_addr: 0.0.0.0:7550
  grpc_addr: 0.0.0.0:7549
  cors_origins: []          # empty = any origin
  body_limit: 1048576       # bytes
  request_timeout: 30s
  trust_proxy: false        # honour X-Forwarded-For / X-Real-IP from the peer (behind a reverse proxy)
  hsts: false               # add Strict-Transport-Security (TLS terminated in front of Zanshin)

database:
  url: postgres://zanshin:zanshin@localhost:5432/zanshin
  max_connections: 16
  migrate: true             # apply embedded migrations on start

redis:
  url: redis://localhost:6379/0
  key_prefix: zanshin

clickhouse:
  enabled: false            # analytics events fall back to PostgreSQL when disabled
  url: http://localhost:8123
  user: default
  password: ""
  database: zanshin

auth:
  jwt_secret: change-me-to-a-random-string-of-at-least-32-chars
  issuer: zanshin
  access_ttl: 1h
  refresh_ttl: 30d
  allow_anonymous_authenticate: false   # dev only: authenticate without a client API key

admin:
  bootstrap_key: null       # set once to mint real admin/client/server keys via /admin/v1/api-keys
  console_session_ttl: 12h  # lifetime of an SSO console login
  # Single sign-on for the console through any OpenID Connect provider (Keycloak, Auth0, Okta,
  # Google Workspace, Authentik, ...). Admin API keys keep working alongside it.
  # oidc:
  #   issuer: https://auth.example.com/realms/games
  #   client_id: zanshin-console
  #   client_secret: null                      # omit for public clients (PKCE is always used)
  #   redirect_url: https://zanshin.example.com/console/auth/callback
  #   scopes: [openid, email, profile]
  #   role_claim: groups                       # ID-token claim: string or array of strings
  #   role_map:                                # claim value -> role; most privileged match wins
  #     liveops-admins: admin
  #     liveops: editor
  #     analysts: viewer
  #   default_role: null                       # role when nothing matches; null = reject login
  #   allowed_domains: [example.com]           # restrict by email domain (empty = any)

log:
  level: info,sqlx=warn,hyper=warn,tower_http=info
  json: false

push:
  provider: none            # none | log (record only, see /admin/v1/push/outbox) | live
  fcm:
    project_id: ""
    service_account_file: ""   # Google service-account JSON (FCM HTTP v1)
  apns:
    team_id: ""
    key_id: ""
    key_file: ""               # .p8 token-auth key
    bundle_id: ""
    sandbox: false

limits:                     # token buckets per caller; *_per_minute sustained, burst_factor minutes of burst
  enabled: true
  ip_per_minute: 120        # unauthenticated / invalid-key requests, keyed by client IP
  client_per_minute: 600    # per client API key (override per key with rate_limit_per_minute)
  session_per_minute: 600   # per identity (session token)
  server_per_minute: 6000   # per server API key
  admin_per_minute: 1200    # per admin API key
  burst_factor: 2.0

audit:                      # every mutating /admin/v1 call -> audit_log (GET /admin/v1/audit)
  enabled: true
  store_bodies: true        # redacted JSON request body
  retention: 90d

taxonomy:                   # event definitions, labels, player model (see docs/api.md → Taxonomy)
  mode: warn                # off | warn (store invalid events, list them in /admin/v1/taxonomy/rejected) | strict (reject)
  auto_discover: true       # register unknown event names as "discovered" definitions
  geoip_db: ""              # path to a MaxMind GeoLite2/GeoIP2 City or Country .mmdb for country/region/city defaults
  session_inactivity: 30m   # play session closes ($session_end) after this much silence
  rejected_keep: 200        # how many rejected/invalid events the debugger keeps (Redis)
