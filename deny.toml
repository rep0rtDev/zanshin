# cargo-deny policy: advisories, licenses, duplicate crates and registry sources.
# Run locally with `cargo deny check`; CI runs it in security.yml.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # serde_yaml (deprecated upstream) pulls unsafe-libyaml; it only parses the operator-provided
  # config file at startup, never untrusted input. Replace when a maintained fork stabilises.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml; trusted config file only" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
    "CC0-1.0",      # tiny-keccak (via parquet)
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { crate = "openssl", reason = "TLS goes through rustls everywhere" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
